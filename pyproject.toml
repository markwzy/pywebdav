[project]
name = "pywebdav"
version = "0.1.0"
description = "面向 NAS 的隐私优先 WebDAV 命令行客户端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
pywebdav = "pywebdav.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pywebdav"]
